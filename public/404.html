<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sahayak Associates - Redirecting...</title>
    <script>
      // Single Page Application fallback for static hosts
      // Preserves original path, query, and hash then redirects to /index.html
      var pathname = window.location.pathname || '';
      var search = window.location.search || '';
      var hash = window.location.hash || '';

      // If user landed on /admin or any subpage, redirect to hash or direct route
      if (pathname && pathname !== '/' && pathname !== '/index.html' && pathname !== '/404.html') {
        window.location.replace('/#' + pathname + search + hash);
      } else {
        window.location.replace('/' + search + hash);
      }
    </script>
  </head>
  <body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; background: #0B192C; color: #fff;">
    <div style="text-align: center; padding: 2rem;">
      <h1 style="color: #C5A059; font-size: 1.5rem; margin-bottom: 0.5rem;">Sahayak Associates</h1>
      <p style="color: #cbd5e1; font-size: 0.95rem;">Loading application route...</p>
      <div style="margin-top: 1.5rem;">
        <a href="/admin" style="display: inline-block; padding: 0.5rem 1rem; margin: 0 0.5rem; background: #C5A059; color: #0B192C; font-weight: 600; text-decoration: none; border-radius: 6px;">Open Admin</a>
        <a href="/" style="display: inline-block; padding: 0.5rem 1rem; margin: 0 0.5rem; background: rgba(255,255,255,0.1); color: #fff; text-decoration: none; border-radius: 6px;">Storefront Home</a>
      </div>
    </div>
  </body>
</html>
